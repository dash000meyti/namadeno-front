      themeCls: st.dark ? 'th-dark' : 'th-light',

      togglePw: function () { self.setState({ showPw: !show }); },
      remember: remember, rememberCls: remember ? 'on' : '', rememberPressed: remember ? 'true' : 'false',
      toggleRemember: function () { self.setState({ remember: !remember }); }
    };
  }
}
